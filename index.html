<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Me on Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    background: #000;
    color: #fff;
  }

  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.78));
    z-index: -1;
  }

  .center {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    text-align: center;
    animation: fadeIn 1.2s ease both;
  }

  .title {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -1px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.7);
  }

  .subtitle {
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    opacity: 0.85;
    margin-bottom: 0.5rem;
  }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2.25rem;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #5865f2, #7c3aed);
    box-shadow: 0 8px 30px rgba(88,101,242,0.5);
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    animation: pulse 2.4s ease-in-out infinite;
    border: none;
    cursor: pointer;
  }

  .discord-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 40px rgba(88,101,242,0.8);
    filter: brightness(1.1);
    animation-play-state: paused;
  }

  .discord-btn:active { transform: scale(0.97); }

  .discord-icon { width: 1.6rem; height: 1.6rem; }

  /* ===== Welcome screen ===== */
  .welcome {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-align: center;
    padding: 1.5rem;
    background: radial-gradient(circle at 50% 40%, rgba(88,101,242,0.25), rgba(0,0,0,0.92) 70%);
    backdrop-filter: blur(14px);
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .welcome.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Your custom image */
  .anime-girl {
    width: 200px;
    height: 200px;
    position: relative;
    animation: bob 3s ease-in-out infinite;
    filter: drop-shadow(0 10px 30px rgba(168,85,247,0.45));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .anime-girl img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(168,85,247,0.7);
    box-shadow: 0 0 40px rgba(168,85,247,0.5), inset 0 0 20px rgba(0,0,0,0.3);
  }

  /* Sparkles around her */
  .sparkle {
    position: absolute;
    font-size: 1.4rem;
    animation: twinkle 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  .sparkle.s1 { top: 0px;    left: -10px;  animation-delay: 0s;    color: #fbcfe8; }
  .sparkle.s2 { top: 20px;   right: -14px; animation-delay: 0.6s;  color: #c4b5fd; }
  .sparkle.s3 { bottom: 0px; left: -18px;  animation-delay: 1.2s; color: #fde68a; }

  .welcome-text {
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #5865f2, #a855f7, #ec4899);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: float 2.8s ease-in-out infinite;
  }

  .hello-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ec4899, #a855f7, #5865f2);
    background-size: 200% 200%;
    box-shadow: 0 8px 30px rgba(236,72,153,0.55);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    animation: gradientShift 4s ease infinite, pulse 2.4s ease-in-out infinite;
  }

  .hello-btn:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 12px 40px rgba(236,72,153,0.9);
  }

  .hello-btn:active { transform: scale(0.96); }

  /* ===== Animations ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 30px rgba(88,101,242,0.5); }
    50%      { box-shadow: 0 8px 45px rgba(88,101,242,0.9); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (max-width: 480px) {
    .discord-btn { padding: 0.9rem 1.8rem; font-size: 1rem; }
    .hello-btn   { padding: 0.9rem 2rem;   font-size: 1.05rem; }
    .anime-girl  { width: 150px; height: 150px; }
  }
</style>
</head>
<body>

  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-video.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg" />
  </audio>

  <main class="center">
    <h1 class="title">Add Me on Discord</h1>
    <p class="subtitle">Click the button below to send me a friend request 👇</p>

    <a id="discordBtn" class="discord-btn"
       href="https://discord.com/users/1109006812298092614"
       target="_blank" rel="noopener noreferrer">
      <svg class="discord-icon" viewBox="0 0 127.14 96.36" aria-hidden="true">
        <path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      <span>Add Me</span>
    </a>
  </main>

  <div id="welcome" class="welcome">
    <div class="anime-girl">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <span class="sparkle s3">✦</span>
      <img src="girl.png" alt="character" />
    </div>

    <h2 class="welcome-text">Hiiiii</h2>
    <button id="helloBtn" class="hello-btn">Hello</button>
  </div>

  <script>
    const DISCORD_ID = "1109006812298092614";
    const WEB_URL   = `https://discord.com/users/${DISCORD_ID}`;
    const APP_URL   = `discord://-/users/${DISCORD_ID}`;

    const bgm        = document.getElementById("bgm");
    const bgVideo    = document.getElementById("bgVideo");
    const discordBtn = document.getElementById("discordBtn");
    const welcome    = document.getElementById("welcome");
    const helloBtn   = document.getElementById("helloBtn");

    bgm.loop = true;
    bgm.volume = 0.5;

    helloBtn.addEventListener("click", () => {
      bgm.play().catch(() => {});
      welcome.classList.add("hide");
    });

    bgm.addEventListener("pause", () => {
      if (!document.hidden) {
        setTimeout(() => bgm.play().catch(() => {}), 100);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        bgm.play().catch(() => {});
        bgVideo.play().catch(() => {});
      }
    });

    discordBtn.addEventListener("click", (e) => {
      e.preventDefault();
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        const start = Date.now();
        window.location.href = APP_URL;
        setTimeout(() => {
          if (Date.now() - start < 1500 && !document.hidden) {
            window.location.href = WEB_URL;
          }
        }, 1200);
      } else {
        window.open(WEB_URL, "_blank", "noopener");
      }
    });
  </script>
</body>
</html>
