<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Me on Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    background: #050510;
    color: #fff;
  }

  /* ===== Background ===== */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    opacity: 0.9; /* Video is brighter now */
  }

  /* Removed the heavy dark overlay completely */

  .center {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1.5rem;
    text-align: center;
    animation: fadeIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  /* ===== Clean Profile Card ===== */
  .profile-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    background: rgba(15, 15, 25, 0.6); /* Kept a slight dark tint on the card itself for text readability */
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 1.5rem 3rem;
    border-radius: 24px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }

  .profile-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #5865f2;
    box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
    margin-bottom: 0.5rem;
  }

  .profile-name {
    font-size: 1.5rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .profile-status {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    color: #b9bbbe;
    background: rgba(0, 0, 0, 0.4);
    padding: 0.3rem 0.8rem;
    border-radius: 99px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #23a55a;
    border-radius: 50%;
    box-shadow: 0 0 8px #23a55a;
    animation: pulseGreen 2s infinite;
  }

  /* ===== Cool Button ===== */
  .discord-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1.2rem 3rem;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    border-radius: 99px;
    background: linear-gradient(135deg, #5865f2, #7c3aed);
    border: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 30px rgba(88, 101, 242, 0.5);
    transition: all 0.3s ease;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    margin-top: 10px;
  }

  .discord-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
    z-index: -1;
  }

  .discord-btn:hover {
    box-shadow: 0 0 40px rgba(88, 101, 242, 0.9);
    transform: translateY(-3px) scale(1.02);
  }

  .discord-btn:hover::before {
    left: 100%;
  }

  .discord-btn:active { transform: scale(0.98); }

  .discord-icon { width: 1.6rem; height: 1.6rem; fill: #fff; }

  /* ===== Welcome Screen (Tap Anywhere) ===== */
  .welcome {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-align: center;
    padding: 1.5rem;
    background: rgba(0, 0, 0, 0.6); /* Made welcome screen slightly transparent so you see the video behind it */
    backdrop-filter: blur(10px);
    transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.8s;
    cursor: pointer;
  }

  .welcome.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .anime-girl {
    width: 200px;
    height: 200px;
    position: relative;
    animation: bob 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .anime-girl img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(168, 85, 247, 0.8);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }

  .anime-girl::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px dashed rgba(168, 85, 247, 0.5);
    animation: spin 10s linear infinite;
  }

  .sparkle {
    position: absolute;
    font-size: 1.6rem;
    animation: twinkle 2s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 0 10px currentColor);
  }
  .sparkle.s1 { top: -10px; left: 0px;   animation-delay: 0s;   color: #fbcfe8; }
  .sparkle.s2 { top: 40px;  right: -20px; animation-delay: 0.6s; color: #c4b5fd; }
  .sparkle.s3 { bottom: 0px; left: -20px; animation-delay: 1.2s; color: #fde68a; }

  .welcome-text {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(to right, #5865f2, #a855f7, #ec4899, #5865f2);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientShift 3s linear infinite;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* ===== Animations ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes pulseGreen {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.85); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-15px) rotate(2deg); }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.3) rotate(45deg); }
  }

  @keyframes gradientShift {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* Mobile Tweaks */
  @media (max-width: 480px) {
    .discord-btn { padding: 1rem 2rem; font-size: 1rem; }
    .anime-girl  { width: 160px; height: 160px; }
    .profile-card { padding: 1.5rem 2rem; width: 90%; }
    .profile-avatar { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

  <!-- Background Video -->
  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-video.mp4" type="video/mp4" />
  </video>
  
  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg" />
  </audio>

  <main class="center">
    
    <!-- ===== CLEAN PROFILE CARD ===== -->
    <div class="profile-card">
      <img src="avatar.png" alt="Profile" class="profile-avatar" />
      <h2 class="profile-name">アヤーン (Ayān)</h2>
      <div class="profile-status">
        <span class="status-dot"></span> Online
      </div>
    </div>

    <!-- Button -->
    <a id="discordBtn" class="discord-btn"
       href="https://discord.com/users/1109006812298092614"
       target="_blank" rel="noopener noreferrer">
      <svg class="discord-icon" viewBox="0 0 127.14 96.36" aria-hidden="true">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      <span>Click to Add</span>
    </a>
  </main>

  <!-- ===== WELCOME SCREEN ===== -->
  <div id="welcome" class="welcome">
    <div class="anime-girl">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <span class="sparkle s3">✦</span>
      <img src="girl.png" alt="character" />
    </div>
    <h2 class="welcome-text">Tap anywhere</h2>
  </div>

  <script>
    const DISCORD_ID = "1109006812298092614";
    const WEB_URL   = `https://discord.com/users/${DISCORD_ID}`;
    const APP_URL   = `discord://-/users/${DISCORD_ID}`;

    const bgm        = document.getElementById("bgm");
    const bgVideo    = document.getElementById("bgVideo");
    const discordBtn = document.getElementById("discordBtn");
    const welcome    = document.getElementById("welcome");

    bgm.loop = true;
    bgm.volume = 0.5;

    // Tap anywhere to start music and enter
    welcome.addEventListener("click", () => {
      bgm.play().catch(() => {});
      welcome.classList.add("hide");
    });

    // Keep music playing
    bgm.addEventListener("pause", () => {
      if (!document.hidden) {
        setTimeout(() => bgm.play().catch(() => {}), 100);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        bgm.play().catch(() => {});
        bgVideo.play().catch(() => {});
      }
    });

    // Mobile App Detection
    discordBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        window.location.href = APP_URL;
        const start = Date.now();
        setTimeout(() => {
          if (Date.now() - start < 1500 && !document.hidden) {
            window.location.href = WEB_URL;
          }
        }, 1200);
      } else {
        window.open(WEB_URL, "_blank", "noopener");
      }
    });
  </script>
</body>
</html>
